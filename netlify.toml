[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/accounts/admit"
  to = "/.netlify/functions/admit-account"
  status = 200

[[redirects]]
  from = "/api/workspaces"
  to = "/.netlify/functions/workspaces"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
