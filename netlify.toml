[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/api/accounts/admit"
  to = "/.netlify/functions/admit-account"
  status = 200

[[redirects]]
  from = "/api/workspaces"
  to = "/.netlify/functions/workspaces"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/activity"
  to = "/.netlify/functions/activity?workspaceId=:workspaceId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/decks"
  to = "/.netlify/functions/decks?workspaceId=:workspaceId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/decks/:deckId/duplicate"
  to = "/.netlify/functions/decks?workspaceId=:workspaceId&deckId=:deckId&action=duplicate"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/decks/:deckId"
  to = "/.netlify/functions/decks?workspaceId=:workspaceId&deckId=:deckId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/slides"
  to = "/.netlify/functions/slides?workspaceId=:workspaceId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/slides/:slideId"
  to = "/.netlify/functions/slides?workspaceId=:workspaceId&slideId=:slideId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/qr-codes"
  to = "/.netlify/functions/qr-codes?workspaceId=:workspaceId"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
