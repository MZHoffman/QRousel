[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
from = "/api/accounts/admit"
  to = "/.netlify/functions/admit-account"
  status = 200

[[redirects]]
  from = "/api/accounts"
  to = "/.netlify/functions/delete-account"
  status = 200

[[redirects]]
from = "/r/:qrCodeId"
  to = "/.netlify/functions/scan-redirect?qrCodeId=:qrCodeId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/qr-codes/:qrCodeId/analytics"
  to = "/.netlify/functions/qr-analytics?workspaceId=:workspaceId&qrCodeId=:qrCodeId"
  status = 200

[[redirects]]
from = "/api/workspaces"
  to = "/.netlify/functions/workspaces"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/members/:memberUid"
  to = "/.netlify/functions/members?workspaceId=:workspaceId&memberUid=:memberUid"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/notifications"
  to = "/.netlify/functions/notifications?workspaceId=:workspaceId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/members"
  to = "/.netlify/functions/members?workspaceId=:workspaceId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/trash/:type/:resourceId"
  to = "/.netlify/functions/trash?workspaceId=:workspaceId&type=:type&resourceId=:resourceId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/trash/:type"
  to = "/.netlify/functions/trash?workspaceId=:workspaceId&type=:type"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/activity"
  to = "/.netlify/functions/activity?workspaceId=:workspaceId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/decks"
  to = "/.netlify/functions/decks?workspaceId=:workspaceId"
  status = 200

[[redirects]]
from = "/api/workspaces/:workspaceId/decks/:deckId/duplicate"
  to = "/.netlify/functions/decks?workspaceId=:workspaceId&deckId=:deckId&action=duplicate"
status = 200

[[redirects]]
  from = "/api/public/decks/:deckId"
  to = "/.netlify/functions/public-deck?deckId=:deckId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/decks/:deckId/publication"
  to = "/.netlify/functions/deck-publication?workspaceId=:workspaceId&deckId=:deckId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/invitations"
  to = "/.netlify/functions/invitations?workspaceId=:workspaceId"
  status = 200

[[redirects]]
  from = "/api/invitations/:token/redeem"
  to = "/.netlify/functions/invitations?token=:token"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/decks/:deckId/slides/:assignmentId"
  to = "/.netlify/functions/deck-slides?workspaceId=:workspaceId&deckId=:deckId&assignmentId=:assignmentId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/decks/:deckId/slides"
  to = "/.netlify/functions/deck-slides?workspaceId=:workspaceId&deckId=:deckId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/decks/:deckId"
  to = "/.netlify/functions/decks?workspaceId=:workspaceId&deckId=:deckId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/slides"
  to = "/.netlify/functions/slides?workspaceId=:workspaceId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/slides/:slideId"
  to = "/.netlify/functions/slides?workspaceId=:workspaceId&slideId=:slideId"
  status = 200

[[redirects]]
from = "/api/workspaces/:workspaceId/qr-codes"
  to = "/.netlify/functions/qr-codes?workspaceId=:workspaceId"
status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/qr-codes/:qrCodeId"
  to = "/.netlify/functions/qr-codes?workspaceId=:workspaceId&qrCodeId=:qrCodeId"
  status = 200

[[redirects]]
  from = "/api/workspaces/:workspaceId/icons"
  to = "/.netlify/functions/icons?workspaceId=:workspaceId"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
